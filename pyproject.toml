[project]
name = "hexagon"
version = "0.1.0"
description = "Hexagonal architecture meets agentic AI — ports, adapters, and autonomous agents"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.2.0",
    "mcp>=2.1.1",
    "ollama>=0.6.2",
    "openai>=3.6.0",
    "redis[asyncio]>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexagon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["hexagon"]

[[tool.importlinter.contracts]]
name = "Domain must not import infrastructure or serving"
type = "forbidden"
source_modules = ["hexagon.domain"]
forbidden_modules = [
    "hexagon.infrastructure",
    "hexagon.serving",
    "hexagon.composition",
    "openai",
    "anthropic",
    "redis",
    "langgraph",
]

[[tool.importlinter.contracts]]
name = "Application must not import infrastructure or serving"
type = "forbidden"
source_modules = ["hexagon.application"]
forbidden_modules = [
    "hexagon.infrastructure",
    "hexagon.serving",
    "openai",
    "anthropic",
]
